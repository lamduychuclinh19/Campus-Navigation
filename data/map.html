<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Navigation System</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .route-panel {
      position: absolute; z-index: 1000; top: 12px; left: 52px; width: min(330px, calc(100vw - 76px));
      padding: 12px; border-radius: 8px; background: #fff; box-shadow: 0 1px 8px #777;
      font: 14px/1.4 Arial, sans-serif;
    }
    .route-panel label { display: block; margin-bottom: 5px; font-weight: 600; }
    .route-panel input, .route-panel button { box-sizing: border-box; width: 100%; margin: 4px 0; padding: 8px; }
    .route-panel button { cursor: pointer; }
    .route-panel button:disabled { cursor: wait; opacity: 0.65; }
    #route-message { margin-top: 6px; white-space: pre-line; }
    .status {
      position: absolute; z-index: 1000; left: 50%; bottom: 18px;
      transform: translateX(-50%); padding: 8px 12px; border-radius: 6px;
      background: #fff; box-shadow: 0 1px 6px #777; font: 14px sans-serif;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <section class="route-panel">
    <label for="start">Điểm xuất phát</label>
    <input id="start" list="place-options" placeholder="Chọn địa điểm, GPS hoặc điểm trên bản đồ">
    <label for="destination">Điểm đến</label>
    <input id="destination" list="place-options" placeholder="Nhập mã/tên địa điểm, ví dụ KTH">
    <datalist id="place-options"></datalist>
    <button id="gps-button" type="button">Dùng vị trí GPS hiện tại</button>
    <button id="map-pick-button" type="button">Chọn điểm xuất phát trên bản đồ</button>
    <button id="route-button" type="button">Tìm đường</button>
    <div id="route-message" role="status">Chọn điểm xuất phát và điểm đến, sau đó bấm “Tìm đường”.</div>
  </section>
  <div class="status" id="status">Đang tải dữ liệu GeoJSON…</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([10.7604, 106.6820], 17);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);
    const waysLayer = L.featureGroup().addTo(map);
    const nodesLayer = L.featureGroup().addTo(map);
    const routingNodesLayer = L.featureGroup();
    const routeLayer = L.featureGroup();
    const junctionCandidatesLayer = L.featureGroup();
    const overlayLayers = {
      "Ways / Đường đi": waysLayer,
      "Nodes / Khu vực": nodesLayer,
      "Routing graph nodes": routingNodesLayer,
      "Dijkstra route": routeLayer,
      "Way junction candidates (review)": junctionCandidatesLayer
    };
    L.control.layers(null, overlayLayers, { collapsed: false }).addTo(map);

    const status = document.getElementById("status");
    const startInput = document.getElementById("start");
    const destinationInput = document.getElementById("destination");
    const routeMessage = document.getElementById("route-message");
    const gpsButton = document.getElementById("gps-button");
    const mapPickButton = document.getElementById("map-pick-button");
    const routeButton = document.getElementById("route-button");
    let choosingStartOnMap = false;
    let startMarker = null;
    let selectedStartCoordinate = null;
    let selectedStartLabel = "";

    function cleanDestination(value) {
      return value.trim().replace(/\.geojson$/i, "");
    }

    function setStartMarker(latlng, label) {
      if (startMarker) startMarker.remove();
      startMarker = L.circleMarker(latlng, {
        radius: 8, color: "#111827", weight: 3, fillColor: "#facc15", fillOpacity: 1
      }).addTo(map).bindTooltip(label).openTooltip();
    }

    async function calculateRoute() {
      const startPlace = selectedStartCoordinate ? "" : cleanDestination(startInput.value);
      const destination = cleanDestination(destinationInput.value);
      if ((!startPlace && !selectedStartCoordinate) || !destination) {
        routeMessage.textContent = "Chọn cả điểm xuất phát lẫn điểm đến trước nhé.";
        return;
      }

      routeLayer.clearLayers();
      routeLayer.addTo(map);
      routeMessage.textContent = `Đang tính tuyến từ ${selectedStartLabel || startPlace} tới ${destination}…`;
      gpsButton.disabled = true;
      mapPickButton.disabled = true;
      routeButton.disabled = true;
      try {
        const params = new URLSearchParams({ destination });
        if (selectedStartCoordinate) {
          params.set("lat", String(selectedStartCoordinate.lat));
          params.set("lon", String(selectedStartCoordinate.lng));
        } else {
          params.set("start_place", startPlace);
        }
        const response = await fetch(`/api/route?${params.toString()}`);
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);

        L.geoJSON(result.route, {
          style: feature => ["access_connector", "gps_connector"].includes(feature.properties?.kind)
            ? { color: "#f59e0b", weight: 4, dashArray: "7 6" }
            : { color: "#e11d48", weight: 7, opacity: 0.95 }
        }).addTo(routeLayer);
        const bounds = routeLayer.getBounds();
        if (bounds.isValid()) map.fitBounds(bounds.pad(0.12));
        const summary = result.summary.split("\n").filter(line => line.startsWith("Shortest route") || line.startsWith("Start point snaps"));
        routeMessage.textContent = summary.join("\n") || "Đã tìm được tuyến.";
      } catch (error) {
        routeLayer.clearLayers();
        routeMessage.textContent = error.message;
      } finally {
        gpsButton.disabled = false;
        mapPickButton.disabled = false;
        routeButton.disabled = false;
      }
    }

    routeButton.addEventListener("click", calculateRoute);
    startInput.addEventListener("input", () => {
      selectedStartCoordinate = null;
      selectedStartLabel = "";
      routeLayer.clearLayers();
      if (startMarker) {
        startMarker.remove();
        startMarker = null;
      }
    });
    destinationInput.addEventListener("input", () => routeLayer.clearLayers());

    gpsButton.addEventListener("click", () => {
      choosingStartOnMap = false;
      mapPickButton.textContent = "Chọn điểm xuất phát trên bản đồ";
      routeLayer.clearLayers();
      if (!navigator.geolocation) {
        routeMessage.textContent = "Trình duyệt này không hỗ trợ lấy vị trí GPS. Hãy chọn điểm trên bản đồ.";
        return;
      }
      routeMessage.textContent = "Đang xin quyền lấy vị trí hiện tại…";
      navigator.geolocation.getCurrentPosition(
        position => {
          const latlng = L.latLng(position.coords.latitude, position.coords.longitude);
          selectedStartCoordinate = latlng;
          selectedStartLabel = "GPS hiện tại";
          startInput.value = `GPS ${latlng.lat.toFixed(6)}, ${latlng.lng.toFixed(6)}`;
          setStartMarker(latlng, `Vị trí GPS (sai số khoảng ${Math.round(position.coords.accuracy)} m)`);
          routeMessage.textContent = "Đã điền điểm xuất phát GPS. Chọn điểm đến rồi bấm “Tìm đường”.";
        },
        error => {
          const messages = {
            1: "Chưa được cấp quyền vị trí. Cho phép location trong trình duyệt hoặc chọn điểm trên bản đồ.",
            2: "Không xác định được vị trí hiện tại. Thử lại hoặc chọn điểm trên bản đồ.",
            3: "Lấy vị trí quá lâu. Thử lại hoặc chọn điểm trên bản đồ."
          };
          routeMessage.textContent = messages[error.code] || "Không lấy được GPS. Hãy chọn điểm trên bản đồ.";
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );
    });

    mapPickButton.addEventListener("click", () => {
      choosingStartOnMap = !choosingStartOnMap;
      mapPickButton.textContent = choosingStartOnMap
        ? "Đang chờ chọn điểm… (bấm để hủy)"
        : "Chọn điểm xuất phát trên bản đồ";
      routeMessage.textContent = choosingStartOnMap
        ? "Bấm vào một vị trí trên bản đồ để đặt điểm xuất phát."
        : "Đã hủy chọn điểm trên bản đồ.";
    });

    map.on("click", event => {
      if (!choosingStartOnMap) return;
      choosingStartOnMap = false;
      mapPickButton.textContent = "Chọn điểm xuất phát trên bản đồ";
      selectedStartCoordinate = event.latlng;
      selectedStartLabel = "điểm đã chọn trên bản đồ";
      startInput.value = `Map ${event.latlng.lat.toFixed(6)}, ${event.latlng.lng.toFixed(6)}`;
      routeLayer.clearLayers();
      setStartMarker(event.latlng, "Điểm xuất phát đã chọn trên bản đồ");
      routeMessage.textContent = "Đã điền điểm xuất phát trên bản đồ. Chọn điểm đến rồi bấm “Tìm đường”.";
    });

    async function loadGeoJson(folder, filename, targetLayer, style) {
      const url = `${folder}/${encodeURIComponent(filename)}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`${filename}: HTTP ${response.status}`);
      const data = await response.json();
      L.geoJSON(data, {
        style,
        pointToLayer: (_feature, latlng) => L.circleMarker(latlng, {
          radius: 6, color: "#b42318", weight: 2,
          fillColor: "#ff6b5f", fillOpacity: 0.9
        }),
        onEachFeature: (_feature, layer) => layer.bindTooltip(filename)
      }).addTo(targetLayer);
      return 1;
    }

    async function loadAll() {
      let loadedWays = 0;
      let loadedNodes = 0;
      const errors = [];
      const response = await fetch("/api/files");
      if (!response.ok) throw new Error(`Không lấy được danh sách file: HTTP ${response.status}`);
      const files = await response.json();
      for (const filename of files.nodes || []) {
        const placeId = filename.replace(/\.geojson$/i, "");
        const option = document.createElement("option");
        option.value = placeId;
        document.getElementById("place-options").appendChild(option);
      }

      for (const filename of files.ways || []) {
        try {
          loadedWays += await loadGeoJson("ways", filename, waysLayer, {
            color: "#1769aa", weight: 5, opacity: 0.9
          });
        } catch (error) { errors.push(error.message); }
      }

      for (const filename of files.nodes || []) {
        try {
          loadedNodes += await loadGeoJson("nodes", filename, nodesLayer, {
            color: "#2f855a", weight: 2, fillColor: "#68c38a", fillOpacity: 0.3
          });
        } catch (error) { errors.push(error.message); }
      }

      // Optional diagnostic layer generated by scripts/build_routing_graph.py.
      try {
        const graphResponse = await fetch("routing/graph.json");
        if (graphResponse.ok) {
          const graph = await graphResponse.json();
          for (const [nodeId, node] of Object.entries(graph.nodes || {})) {
            const marker = L.circleMarker(
              [node.coordinates[1], node.coordinates[0]],
              { radius: 5, color: "#5b21b6", weight: 2, fillColor: "#a78bfa", fillOpacity: 0.9 }
            ).bindTooltip(`${nodeId} (${(node.endpoint_refs || []).join(", ")})`);
            marker.addTo(routingNodesLayer);
          }
        }
      } catch (error) {
        console.info("Graph preview not generated yet; run build_routing_graph.py.");
      }

      try {
        const junctionResponse = await fetch("routing/way_intersections.geojson");
        if (junctionResponse.ok) {
          const junctionData = await junctionResponse.json();
          L.geoJSON(junctionData, {
            pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
              radius: 6, color: "#7c2d12", weight: 2,
              fillColor: "#fb923c", fillOpacity: 0.9
            }),
            onEachFeature: (feature, layer) => {
              const p = feature.properties || {};
              layer.bindTooltip(`${p.way_1} ↔ ${p.way_2} (${p.connection_type}, ${p.gap_m} m)`);
            }
          }).addTo(junctionCandidatesLayer);
        }
      } catch (error) {
        console.info("No junction candidate layer yet; run inspect_way_intersections.py.");
      }

      const bounds = L.featureGroup([waysLayer, nodesLayer]).getBounds();
      if (bounds.isValid()) map.fitBounds(bounds.pad(0.08));

      status.textContent = `Đã tải ${loadedWays} ways và ${loadedNodes} node/khu vực`;
      if (errors.length) {
        console.warn("Một số GeoJSON không tải được:", errors);
        status.textContent += `; lỗi ${errors.length} file (xem Console)`;
      }
      setTimeout(() => status.remove(), 6000);
    }

    loadAll().catch(error => {
      status.textContent = "Không tải được dữ liệu. Hãy mở bằng web server local.";
      console.error(error);
    });
  </script>
</body>
</html>
